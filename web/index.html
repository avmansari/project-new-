<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOKEN_NAME Claim</title>
<style>
:root{--bg:#fff7e0;--ink:#1b1b1b;--accent:#ff5c35;--card:#fff;--ok:#1a9d57}
@media(prefers-color-scheme:dark){:root{--bg:#1c1710;--ink:#f6efe0;--card:#2a231a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:16px}
.card{width:100%;max-width:440px;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:28px;box-shadow:8px 8px 0 var(--ink);text-align:center}
h1{margin:0 0 4px;font-size:2rem}p{margin:6px 0 18px}
button{width:100%;padding:14px;font-size:1.1rem;font-weight:700;border:3px solid var(--ink);border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.amt{font-size:1.6rem;font-weight:800;margin:10px 0}#msg{min-height:1.4em;margin-top:12px}
</style></head><body>
<main class="card">
  <h1>TOKEN_NAME</h1>
  <p>Total supply: 100,000,000,000</p>
  <button id="connect">Connect Wallet</button>
  <div id="result" hidden>
    <div class="amt" id="amt"></div>
    <button id="claim">Claim</button>
  </div>
  <div id="msg" role="status"></div>
  <p><small>Trading opens after launch announcement.</small></p>
</main>
<script type="module">
import {BrowserProvider,Contract,formatUnits} from 'https://esm.sh/ethers@6';
// === CONFIG: fill from Robinhood Chain official docs + your deployment ===
const CONFIG={chainIdHex:'0x0',chainName:'Robinhood Chain',rpcUrl:'',explorer:'',claimAddress:'0x0000000000000000000000000000000000000000'};
const ABI=['function claim(uint256 index,uint256 amount,bytes32[] proof)','function claimed(uint256) view returns (bool)'];
const $=id=>document.getElementById(id);let merkle=null,signer=null,entry=null;
fetch('../data/merkle.json').then(r=>r.json()).then(j=>merkle=j).catch(()=>{});
async function ensureChain(){
  try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CONFIG.chainIdHex}]})}
  catch(e){if(e.code===4902)await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CONFIG.chainIdHex,chainName:CONFIG.chainName,rpcUrls:[CONFIG.rpcUrl],blockExplorerUrls:[CONFIG.explorer]}]});else throw e}
}
$('connect').onclick=async()=>{
  if(!window.ethereum){$('msg').textContent='Install MetaMask (or another EVM wallet).';return}
  try{
    const provider=new BrowserProvider(window.ethereum);await provider.send('eth_requestAccounts',[]);
    if(CONFIG.chainIdHex!=='0x0')await ensureChain();
    signer=await provider.getSigner();
    const addr=await signer.getAddress();
    entry=merkle&&Object.entries(merkle.claims).find(([w])=>w.toLowerCase()===addr.toLowerCase())?.[1];
    $('connect').textContent=addr.slice(0,6)+'...'+addr.slice(-4);
    if(!entry){$('msg').textContent='This wallet is not eligible.';return}
    $('amt').textContent=Number(formatUnits(entry.amount,18)).toLocaleString()+' TOKEN_NAME';$('result').hidden=false;
  }catch(e){$('msg').textContent=e.shortMessage||e.message}
};
$('claim').onclick=async()=>{
  if(CONFIG.claimAddress.endsWith('0000')){$('msg').textContent='Claim contract not deployed yet.';return}
  try{
    $('claim').disabled=true;$('msg').textContent='Confirm in wallet...';
    const c=new Contract(CONFIG.claimAddress,ABI,signer);
    const tx=await c.claim(entry.index,entry.amount,entry.proof);await tx.wait();
    $('msg').textContent='Claimed!';
  }catch(e){$('msg').textContent=e.reason||e.shortMessage||e.message;$('claim').disabled=false}
};
</script></body></html>
